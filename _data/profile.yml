short_bio: >-
  <p>
    Hi, my name is Qilong Cheng, welcome to my homepage. 
    I received my B.E. in Mechanical Engineering from Tsinghua University in 2017 and my Ph.D. in Mechanical Engineering from the University of California, Berkeley in 2021 under the supervision of [Prof. David B. Bogy](https://me.berkeley.edu/people/david-b-bogy/).
    After graduation, I worked as a Postdoctoral Research Scientist at Columbia University with [Prof. Yuan Yang](https://blogs.cuit.columbia.edu/yanggroup/) from 2022 to 2024. 
    Currently, I am a Postdoctoral Researcher in the School of Mechanical Engineering at Purdue University, working with [Prof. Tian Li](https://www.tianliresearch.com/). 
  </p>
  <p>
    My research focuses on heat and mass transport across scales, connecting fundamental transport science with advanced materials and device technologies for electronics, energy, and water applications. 
    My work spans nanoscale thermal transport and metrology, adaptive and radiative materials for thermal regulation, and bio-derived micro/nanofluidic platforms. 
    Across these areas, I integrate experiments, transport modeling, and materials/device design to understand and control heat, mass, and ion transport.
 </p>
 <p>
    Welcome to reach out to me for research discussions and potential collaborations!
 </p>
 
